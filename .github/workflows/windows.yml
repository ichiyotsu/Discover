name: Windows
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet test tests/TokiDiscover.Tests/TokiDiscover.Tests.csproj
        working-directory: windows
      - run: dotnet build src/TokiDiscover/TokiDiscover.csproj -p:Platform=x64
        working-directory: windows
