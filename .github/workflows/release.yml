name: Build

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokidiscover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android 17 SDK
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          sdkmanager=""
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager="$(command -v sdkmanager)"
          else
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$sdkmanager"
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || true
          "$sdkmanager" --sdk_root="$sdk_root" "platforms;android-37.2" "build-tools;37.0.0"
      - name: Assemble release
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace --no-daemon
      - name: Collect APK
        run: |
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" TokiDiscover-0.1.0-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TokiDiscover-0.1.0-android
          path: TokiDiscover-0.1.0-android.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish unpackaged self-contained build
        run: >
          dotnet publish windows/TokiDiscover/TokiDiscover.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
      - name: Stage publish output
        shell: pwsh
        run: |
          $publish = Get-ChildItem -Path windows/TokiDiscover/bin -Recurse -Directory -Filter publish |
            Where-Object { Test-Path (Join-Path $_.FullName 'TokiDiscover.exe') } |
            Select-Object -First 1
          if (-not $publish) { throw 'Publish output was not found.' }
          $stage = 'windows/TokiDiscover/bin/publish'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          Copy-Item -Recurse $publish.FullName $stage
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath dist/TokiDiscover-0.1.0-windows-portable.zip -Force
      - name: Setup installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows/installer/TokiDiscover.iss
      - uses: actions/upload-artifact@v4
        with:
          name: TokiDiscover-0.1.0-windows
          path: |
            dist/TokiDiscover-0.1.0-windows-setup.exe
            dist/TokiDiscover-0.1.0-windows-portable.zip

  ios:
    name: iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project TokiDiscover.xcodeproj \
            -scheme TokiDiscover \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          app=$(find build/Build/Products -name 'TokiDiscover.app' -type d | head -n 1)
          test -n "$app"
          rm -rf Payload
          mkdir Payload
          cp -R "$app" Payload/
          zip -qry "$GITHUB_WORKSPACE/TokiDiscover-0.1.0-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TokiDiscover-0.1.0-ios
          path: TokiDiscover-0.1.0-ios-unsigned.ipa

  version:
    name: Version order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare release and prerelease versions
        run: bash scripts/version.sh --self-test

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, ios, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          kind="$(bash scripts/version.sh --kind "$tag")"
          if [[ "$kind" == "prerelease" ]]; then
            create_args=(--prerelease --latest=false)
            edit_args=(--prerelease --latest=false)
          else
            create_args=(--latest)
            edit_args=(--prerelease=false --latest)
          fi
          cat > release-notes.txt <<EOF
          TokiDiscover ${version}

          - Windows：安装包与便携版。Windows 11 已包含 WebView2；Windows 10 需安装 Evergreen WebView2 Runtime。
          - Android：arm64-v8a 已签名 APK，可覆盖安装后续版本。
          - iOS / iPadOS：未签名 IPA，需用 SideStore 自行签名后侧载。

          仓库中的 Android 签名口令是公开的，只用于这个开源构建。分叉后若要对外发布，请更换自己的密钥库。
          EOF
          mapfile -t files < <(find artifacts -type f | sort)
          printf 'Uploading %s (%s):\n' "$tag" "$kind"
          printf '  %s\n' "${files[@]}"
          test "${#files[@]}" -ge 4
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GH_REPO" --clobber
            gh release edit "$tag" --repo "$GH_REPO" --title "TokiDiscover ${version}" --notes-file release-notes.txt "${edit_args[@]}"
          else
            gh release create "$tag" "${files[@]}" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "TokiDiscover ${version}" --notes-file release-notes.txt "${create_args[@]}"
          fi
